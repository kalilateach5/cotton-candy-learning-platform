<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotton Candy Student App</title><style>:root{--p:#ff3ea5;--b:#2bc3ff;--v:#8c5cff;--m:#22c9a7;--y:#ffd23f;--i:#392a50;--bg:#fff7fc}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--i);background:radial-gradient(circle at 4% 2%,#ff91cd 0 6%,transparent 6.3%),radial-gradient(circle at 96% 3%,#74ddff 0 6%,transparent 6.3%),var(--bg)}main{max-width:1040px;margin:auto;padding:28px 18px 60px}.card{background:#fff;border:1px solid #ead2e3;border-radius:22px;padding:26px;box-shadow:0 12px 28px #6e3f641a}.hero{text-align:center}.hero h1{font-size:clamp(38px,7vw,68px);margin:5px}.k{color:var(--p);font-weight:900;letter-spacing:2px}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}input,select{width:100%;padding:12px;border:2px solid var(--b);border-radius:12px;font-size:16px}label{font-weight:700}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;color:#fff;background:var(--v);cursor:pointer;font-size:15px}.pink{background:var(--p)}.blue{background:var(--b)}.mint{background:var(--m)}.hidden{display:none!important}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.progress{height:12px;background:#eadff0;border-radius:9px;overflow:hidden;margin:15px 0 22px}.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--b),var(--m))}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--p);border-radius:14px;padding:15px;font-size:18px;color:var(--i);cursor:pointer}.opt:nth-child(2){border-color:var(--b)}.opt:nth-child(3){border-color:var(--v)}.opt:nth-child(4){border-color:var(--m)}.feedback{margin-top:18px;padding:17px;border-radius:14px}.wrong{background:#f3eaff;border-left:8px solid var(--y)}.right{background:#e8fff7;border-left:8px solid var(--m)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ead2e3;text-align:left}.stat{padding:15px;border-radius:15px;background:#fff;border:2px solid #ead2e3}.stat b{font-size:25px;color:var(--v)}.tabs button{margin:4px}.warn{color:#c73652;font-weight:800}.small{font-size:13px;color:#74697c}@media(max-width:700px){.g3{grid-template-columns:1fr}.card{padding:19px}}</style></head><body><main>
<section id="start" class="card hero"><div class="k">COTTON CANDY</div><h1>Math Review Adventure</h1><p>Branching practice with hints, scoring, badges, and a Canvas-ready receipt.</p><div class="grid g3"><label>Name<input id="name"></label><label>Date<input id="date" type="date"></label><label>Period<input id="period"></label></div><p><button class="btn pink" onclick="begin()">Start adventure →</button></p></section>
<section id="quiz" class="card hidden"><div class="top"><div id="count" class="k"></div><div id="badge"></div></div><div class="progress"><div id="bar" class="bar"></div></div><div class="small" id="standard"></div><h2 id="question"></h2><div id="opts" class="opts"></div><div id="feedback"></div><div class="row" style="margin-top:20px"><button id="prev" class="btn blue" onclick="previous()">← Previous</button><button id="next" class="btn hidden" onclick="next()">Continue →</button></div></section>
<section id="finish" class="card hidden"><div class="hero"><div style="font-size:55px">🏆</div><div class="k">COTTON CANDY CHAMPION</div><h1>Adventure Complete!</h1><p id="summary"></p></div><div class="grid g3" id="stats"></div><h2>Question results</h2><table><thead><tr><th>Q</th><th>Skill</th><th>Points</th><th>Attempts</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table><div class="row" style="margin-top:20px"><button class="btn" onclick="downloadResult()">Download Canvas receipt (.json)</button><button class="btn blue" onclick="downloadCSV()">Download score report (.csv)</button></div></section>
</main><script>const QUESTIONS=[{"id": 1, "standard": "Real numbers", "question": "Which number below represents an irrational number?", "options": ["0.625", "9/4", "√50", "-7"], "answer": 2, "hint": "Check whether the square root is a perfect square."}, {"id": 2, "standard": "Compare real numbers", "question": "Which number will NOT make √196 < x < 15 3/4 true?", "options": ["1450%", "0.125", "14.8", "√225"], "answer": 1, "hint": "Convert each choice to a decimal and compare with 14 and 15.75."}, {"id": 3, "standard": "Square roots", "question": "A square has area 484 square feet. What is its perimeter?", "options": ["22 ft", "44 ft", "88 ft", "1,936 ft"], "answer": 2, "hint": "Find the side with √484, then multiply by 4."}, {"id": 4, "standard": "Order real numbers", "question": "Which order is least to greatest: Ava 1/8, Ben 13%, Chloe 0.15, Diego 1/5?", "options": ["Ava, Ben, Chloe, Diego", "Ben, Ava, Chloe, Diego", "Ben, Chloe, Ava, Diego", "Diego, Chloe, Ben, Ava"], "answer": 0, "hint": "Write every amount as a decimal."}, {"id": 5, "standard": "Compare real numbers", "question": "Who has the largest answer: Maya 2.9, Ethan 14/5, Sofia √9, Liam 1 + √5?", "options": ["Maya", "Ethan", "Sofia", "Liam"], "answer": 3, "hint": "Estimate √5 and convert 14/5."}, {"id": 6, "standard": "Square roots", "question": "Will a √144-foot bookshelf fit in an 11-foot storage unit?", "options": ["Yes", "No"], "answer": 1, "hint": "Evaluate √144 before comparing."}, {"id": 7, "standard": "Scientific notation", "question": "Write 0.0000527 in scientific notation.", "options": ["5.27 × 10⁻⁵", "5.27 × 10⁵", "52.7 × 10⁻⁶", "0.527 × 10⁻⁴"], "answer": 0, "hint": "The coefficient must be at least 1 and less than 10."}, {"id": 8, "standard": "Estimate square roots", "question": "Between which consecutive whole numbers is √80?", "options": ["7 and 8", "8 and 9", "9 and 10", "10 and 11"], "answer": 1, "hint": "Use nearby perfect squares 64 and 81."}, {"id": 9, "standard": "Compare real numbers", "question": "Which set contains only numbers less than -0.4?", "options": ["-1/2, -1.2, -√1", "-0.35, 25%, -0.39", "-1/2, -0.35, -0.39", "25%, -1.2, -√1"], "answer": 0, "hint": "Check signs and compare values on a number line."}, {"id": 10, "standard": "Order real numbers", "question": "Which list is in ascending order?", "options": ["-2.5, -2, 280%, √8, 3.5 × 10²", "-2, -2.5, √8, 280%, 3.5 × 10²", "√8, -2.5, -2, 280%, 3.5 × 10²", "-2.5, 280%, -2, √8, 3.5 × 10²"], "answer": 0, "hint": "Convert 280% to 2.8 and estimate √8."}, {"id": 11, "standard": "Irrational numbers", "question": "Which statement about irrational decimals is true?", "options": ["They always terminate.", "They repeat forever.", "They neither terminate nor repeat.", "All decimals are irrational."], "answer": 2, "hint": "Think about the decimal form of π."}, {"id": 12, "standard": "Evaluate expressions", "question": "Evaluate -6x + y² when x = 5 and y = 8.", "options": ["34", "58", "94", "-34"], "answer": 0, "hint": "Substitute first, then use order of operations."}, {"id": 13, "standard": "Scientific notation", "question": "Which is NOT correct scientific notation?", "options": ["4.2 × 10⁵", "0.42 × 10⁶", "7.1 × 10⁻³", "9.8 × 10²"], "answer": 1, "hint": "The coefficient must be from 1 up to, but not including, 10."}, {"id": 14, "standard": "Real number system", "question": "Which number is misplaced in the irrational group?", "options": ["√225", "π", "√12", "None"], "answer": 0, "hint": "Evaluate the perfect square root."}, {"id": 15, "standard": "Order real numbers", "question": "Which runner order is fastest to slowest?", "options": ["Noah, Olivia, Emma, Lucas, Mia", "Olivia, Noah, Emma, Lucas, Mia", "Emma, Noah, Olivia, Lucas, Mia", "Mia, Lucas, Emma, Olivia, Noah"], "answer": 0, "hint": "Convert the times to 42.5, 43, 43, 43.5, and 44.2 seconds."}, {"id": 16, "standard": "Scientific notation", "question": "Write 8.04 × 10⁴ in standard form.", "options": ["804", "8,040", "80,400", "804,000"], "answer": 2, "hint": "Move the decimal four places right."}, {"id": 17, "standard": "Scientific notation", "question": "Write 5.6 × 10⁻³ in standard form.", "options": ["0.0056", "0.056", "560", "5,600"], "answer": 0, "hint": "A negative exponent makes a number less than 1."}, {"id": 18, "standard": "Estimate square roots", "question": "Which is the best estimate for √18?", "options": ["3.2", "4.24", "4.8", "5.2"], "answer": 1, "hint": "√18 lies between √16 and √25."}, {"id": 19, "standard": "Real number system", "question": "How are whole numbers W related to real numbers R?", "options": ["W is completely inside R.", "R is completely inside W.", "They are separate.", "They overlap only."], "answer": 0, "hint": "Every whole number is a real number."}, {"id": 20, "standard": "Evaluate expressions", "question": "Evaluate (-24 + √81 + 5³) ÷ [(3/4)(16) - 2].", "options": ["9", "10", "11", "12"], "answer": 2, "hint": "Evaluate the numerator and denominator separately."}, {"id": 21, "standard": "Scientific notation", "question": "Order 6.3×10⁻⁷, 6.3×10⁻², 6.3×10⁴, 6.3×10¹⁰ ascending.", "options": ["As shown", "Reverse order", "-2, -7, 4, 10", "-7, 4, -2, 10"], "answer": 0, "hint": "The coefficients match, so compare the exponents."}];let at=0,started=0,results=[],student={};function begin(){student={name:name.value.trim(),date:date.value,period:period.value.trim()};if(!student.name||!student.date||!student.period)return alert('Enter name, date, and period.');results=QUESTIONS.map(()=>({attempts:0,wrongChoices:[],points:0,seconds:0,completed:false,rapid:false}));start.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){let q=QUESTIONS[at],r=results[at];count.textContent=`QUESTION ${at+1} OF 21`;bar.style.width=`${(at+1)/21*100}%`;standard.textContent=q.standard;question.textContent=q.question;opts.innerHTML='';q.options.forEach((o,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+o;b.disabled=r.completed;b.onclick=()=>answer(n);opts.appendChild(b)});feedback.innerHTML=r.completed?'<div class="feedback right">✓ Correct path unlocked.</div>':'';next.classList.toggle('hidden',!r.completed);prev.style.visibility=at?'visible':'hidden';badge.textContent=at>=20?'☁️ Champion':at>=14?'🍬 Candy Scholar':at>=7?'🍭 Sweet Starter':'';started=Date.now()}function answer(n){let q=QUESTIONS[at],r=results[at],elapsed=(Date.now()-started)/1000;r.attempts++;if(elapsed<2.5)r.rapid=true;if(n===q.answer){r.completed=true;r.points=Math.max(1,6-r.attempts);r.seconds+=Math.round(elapsed);save();render()}else{r.wrongChoices.push(String.fromCharCode(65+n));feedback.innerHTML=`<div class="feedback wrong"><b>Not quite.</b><br>Hint: ${q.hint}<br><span class="small">The correct answer is not shown.</span></div>`;save()}}function next(){if(at===20)return finish();at++;render()}function previous(){if(at){at--;render()}}function payload(){return{version:'dream-1',student,completedAt:new Date().toISOString(),totalPoints:results.reduce((s,r)=>s+r.points,0),maxPoints:105,totalAttempts:results.reduce((s,r)=>s+r.attempts,0),rapidGuessFlags:results.filter(r=>r.rapid).length,results:results.map((r,n)=>({question:n+1,standard:QUESTIONS[n].standard,points:r.points,attempts:r.attempts,wrongChoices:r.wrongChoices,seconds:r.seconds,rapidGuess:r.rapid}))}}function save(){localStorage.setItem('cc_latest',JSON.stringify(payload()))}function finish(){quiz.classList.add('hidden');finish.classList.remove('hidden');let p=payload();summary.textContent=`${student.name} • Period ${student.period} • ${p.totalPoints}/${p.maxPoints}`;stats.innerHTML=`<div class="stat"><b>${p.totalPoints}/105</b><br>Total score</div><div class="stat"><b>${p.totalAttempts}</b><br>Total attempts</div><div class="stat"><b>${p.rapidGuessFlags}</b><br>Rapid-guess flags</div>`;rows.innerHTML=p.results.map(r=>`<tr><td>${r.question}</td><td>${r.standard}</td><td>${r.points}/5</td><td>${r.attempts}</td><td>${r.seconds}s</td></tr>`).join('');save()}function dl(n,t,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function stem(){return student.name.replace(/[^a-z0-9]+/gi,'_')+'_P'+student.period+'_cotton_candy'}function downloadResult(){dl(stem()+'.json',JSON.stringify(payload(),null,2),'application/json')}function downloadCSV(){let p=payload(),x='Question,Standard,Points,Attempts,Wrong Choices,Seconds,Rapid Guess
'+p.results.map(r=>[r.question,'"'+r.standard+'"',r.points,r.attempts,'"'+r.wrongChoices.join('|')+'"',r.seconds,r.rapidGuess].join(',')).join('
');dl(stem()+'.csv',x,'text/csv')};</script></body></html>
