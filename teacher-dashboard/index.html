<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotton Candy Teacher Dashboard</title><style>:root{--p:#ff3ea5;--b:#2bc3ff;--v:#8c5cff;--m:#22c9a7;--y:#ffd23f;--i:#392a50;--bg:#fff7fc}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--i);background:radial-gradient(circle at 4% 2%,#ff91cd 0 6%,transparent 6.3%),radial-gradient(circle at 96% 3%,#74ddff 0 6%,transparent 6.3%),var(--bg)}main{max-width:1040px;margin:auto;padding:28px 18px 60px}.card{background:#fff;border:1px solid #ead2e3;border-radius:22px;padding:26px;box-shadow:0 12px 28px #6e3f641a}.hero{text-align:center}.hero h1{font-size:clamp(38px,7vw,68px);margin:5px}.k{color:var(--p);font-weight:900;letter-spacing:2px}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}input,select{width:100%;padding:12px;border:2px solid var(--b);border-radius:12px;font-size:16px}label{font-weight:700}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;color:#fff;background:var(--v);cursor:pointer;font-size:15px}.pink{background:var(--p)}.blue{background:var(--b)}.mint{background:var(--m)}.hidden{display:none!important}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.progress{height:12px;background:#eadff0;border-radius:9px;overflow:hidden;margin:15px 0 22px}.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--b),var(--m))}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--p);border-radius:14px;padding:15px;font-size:18px;color:var(--i);cursor:pointer}.opt:nth-child(2){border-color:var(--b)}.opt:nth-child(3){border-color:var(--v)}.opt:nth-child(4){border-color:var(--m)}.feedback{margin-top:18px;padding:17px;border-radius:14px}.wrong{background:#f3eaff;border-left:8px solid var(--y)}.right{background:#e8fff7;border-left:8px solid var(--m)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ead2e3;text-align:left}.stat{padding:15px;border-radius:15px;background:#fff;border:2px solid #ead2e3}.stat b{font-size:25px;color:var(--v)}.tabs button{margin:4px}.warn{color:#c73652;font-weight:800}.small{font-size:13px;color:#74697c}@media(max-width:700px){.g3{grid-template-columns:1fr}.card{padding:19px}}</style></head><body><main><section class="card"><div class="k">TEACHER DASHBOARD</div><h1>Cotton Candy Analytics</h1><p>Import student JSON receipts downloaded from the student app or collected through Canvas.</p><input id="files" type="file" multiple accept=".json"><div class="grid g3" style="margin-top:15px"><label>Period<select id="period" onchange="render()"><option value="">All periods</option></select></label><label>Student<input id="search" placeholder="Search student" oninput="render()"></label><label>Rapid-guess threshold<select id="threshold" onchange="render()"><option value="1">1+ flags</option><option value="3" selected>3+ flags</option><option value="5">5+ flags</option></select></label></div><div id="stats" class="grid g3" style="margin-top:18px"></div><h2>Student submissions</h2><div style="overflow:auto"><table><thead><tr><th>Student</th><th>Period</th><th>Score</th><th>Attempts</th><th>Rapid flags</th><th>Completed</th></tr></thead><tbody id="students"></tbody></table></div><h2>Question analysis</h2><div style="overflow:auto"><table><thead><tr><th>Q</th><th>Skill</th><th>Avg points</th><th>Avg attempts</th><th>Rapid flags</th></tr></thead><tbody id="questions"></tbody></table></div><div class="row"><button class="btn" onclick="exportClass()">Export class summary CSV</button><button class="btn blue" onclick="clearAll()">Clear imported data</button></div></section></main><script>let data=[];files.onchange=async e=>{for(const f of e.target.files){try{let x=JSON.parse(await f.text());if(x.student&&x.results)data.push(x)}catch{}}dedupe();setupPeriods();render()};function dedupe(){let m=new Map;data.forEach(x=>m.set(x.student.name+'|'+x.student.period+'|'+x.completedAt,x));data=[...m.values()]}function setupPeriods(){let old=period.value,vals=[...new Set(data.map(x=>x.student.period))].sort();period.innerHTML='<option value="">All periods</option>'+vals.map(x=>`<option>${x}</option>`).join('');period.value=old}function filtered(){let s=search.value.toLowerCase();return data.filter(x=>(!period.value||x.student.period===period.value)&&x.student.name.toLowerCase().includes(s))}function render(){let d=filtered(),avg=d.length?Math.round(d.reduce((s,x)=>s+x.totalPoints,0)/d.length):0,flags=d.reduce((s,x)=>s+x.rapidGuessFlags,0),risk=d.filter(x=>x.rapidGuessFlags>=+threshold.value).length;stats.innerHTML=`<div class="stat"><b>${d.length}</b><br>Submissions</div><div class="stat"><b>${avg}/105</b><br>Average score</div><div class="stat"><b>${risk}</b><br>Rapid-guess reviews</div>`;students.innerHTML=d.map(x=>`<tr><td>${x.student.name}</td><td>${x.student.period}</td><td>${x.totalPoints}/105</td><td>${x.totalAttempts}</td><td class="${x.rapidGuessFlags>=+threshold.value?'warn':''}">${x.rapidGuessFlags}</td><td>${new Date(x.completedAt).toLocaleString()}</td></tr>`).join('');let rows=[];for(let n=1;n<=21;n++){let r=d.map(x=>x.results.find(y=>y.question===n)).filter(Boolean);if(!r.length)continue;rows.push(`<tr><td>${n}</td><td>${r[0].standard}</td><td>${(r.reduce((s,y)=>s+y.points,0)/r.length).toFixed(1)}</td><td>${(r.reduce((s,y)=>s+y.attempts,0)/r.length).toFixed(1)}</td><td>${r.filter(y=>y.rapidGuess).length}</td></tr>`)}questions.innerHTML=rows.join('')}function exportClass(){let d=filtered(),x='Student,Period,Score,Attempts,Rapid Flags,Completed
'+d.map(s=>[`"${s.student.name}"`,s.student.period,s.totalPoints,s.totalAttempts,s.rapidGuessFlags,s.completedAt].join(',')).join('
');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/csv'}));a.download='cotton_candy_class_summary.csv';a.click()}function clearAll(){data=[];setupPeriods();render()}render();</script></body></html>
